---
# Rumahweb cPanel Git Deployment — wedding-invitation-api
# Document root subdomain HARUS mengarah ke folder public/ (lihat docs/DEPLOY-RUMAHWEB.md)
#
# Ringan: tanpa `composer install` tiap deploy (sering bikin antrian queued stuck).
# `vendor/` di server dipertahankan; jalankan composer manual hanya jika dependensi berubah.
# `storage/` tidak di-copy agar upload/log tidak tertimpa.

deployment:
  tasks:
    - export DEPLOYPATH=/home/sank9295/public_html/api.wedding-invitation.sanadwi.my.id
    - /bin/cp -R app bootstrap config database public resources routes artisan composer.json composer.lock $DEPLOYPATH/
    - /bin/cp -R vendor $DEPLOYPATH/ 2>/dev/null || true
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force --no-interaction
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/config.php $DEPLOYPATH/bootstrap/cache/routes-v7.php $DEPLOYPATH/bootstrap/cache/routes.php
    - cd $DEPLOYPATH && /usr/local/bin/php artisan storage:link --force 2>/dev/null || true
    - cd $DEPLOYPATH && chmod -R 775 storage bootstrap/cache
