---
# Rumahweb cPanel Git Deployment — wedding-invitation-api
# Document root subdomain HARUS mengarah ke folder public/ (lihat docs/DEPLOY-RUMAHWEB.md)

deployment:
  tasks:
    - export DEPLOYPATH=/home/sank9295/public_html/api.wedding-invitation.sanadwi.my.id
    - /bin/cp -R app bootstrap config database public resources routes storage vendor artisan composer.json composer.lock $DEPLOYPATH/
    - cd $DEPLOYPATH && /usr/local/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction 2>/dev/null || cd $DEPLOYPATH && php composer.phar install --no-dev --optimize-autoloader --no-interaction
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force --no-interaction
    - cd $DEPLOYPATH && /usr/local/bin/php artisan storage:link --force 2>/dev/null || true
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:cache
    - cd $DEPLOYPATH && chmod -R 775 storage bootstrap/cache
